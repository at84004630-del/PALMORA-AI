steps:
  # 1. Build Palmora API Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/palmora-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/palmora-api:latest'
      - './services/api'

  # 2. Build Palmora Web Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/web/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/palmora-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/palmora-web:latest'
      - '.'

  # 3. Push Palmora API images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/palmora-api:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/palmora-api:latest']

  # 4. Push Palmora Web images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/palmora-web:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/palmora-web:latest']

  # 5. Deploy Palmora API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'palmora-api'
      - '--image=gcr.io/$PROJECT_ID/palmora-api:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--concurrency=80'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--min-instances=0'
      - '--max-instances=20'
      - '--port=8000'

  # 6. Deploy Palmora Web to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'palmora-web'
      - '--image=gcr.io/$PROJECT_ID/palmora-web:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--concurrency=80'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--port=3000'

images:
  - 'gcr.io/$PROJECT_ID/palmora-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/palmora-api:latest'
  - 'gcr.io/$PROJECT_ID/palmora-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/palmora-web:latest'

timeout: '1200s'
options:
  machineType: 'E2_HIGHCPU_8'
