services:
  # 1. Palmora AI Computer Vision & Palmistry Backend
  - type: web
    name: palmora-api
    runtime: python
    buildCommand: pip install -r services/api/requirements.txt
    startCommand: uvicorn services.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true

  # 2. Palmora AI Next.js Web Frontend
  - type: web
    name: palmora-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: palmora-api
          property: host

