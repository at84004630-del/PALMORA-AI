name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests (FastAPI & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (OpenCV & GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          SECRET_KEY: test-session-signing-key-for-ci-minimum-32-chars-long
          ENVIRONMENT: development
          DATABASE_ENABLED: false
        run: |
          python -m pytest services/api/tests -v

  frontend-test:
    name: Frontend Quality & Typecheck (Next.js & Shared Types)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Shared Types
        run: pnpm --filter @palmora/shared-types build

      - name: Run Monorepo Typecheck
        run: npm run check:types

      - name: Run Frontend Tests
        run: npm test

  e2e-test:
    name: Headless E2E Browser Regression Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Shared Types
        run: pnpm --filter @palmora/shared-types build

      - name: Install Playwright Browsers with OS Dependencies
        run: pnpm --filter @palmora/web exec playwright install --with-deps chromium

      - name: Build Next.js Production Web Bundle
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Run Headless Playwright Regression Flow (/scan -> /analysis -> /reading)
        run: pnpm --filter @palmora/web run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, e2e-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: false
          tags: palmora-api:latest

      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: palmora-web:latest
